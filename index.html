<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#04060a">
<title>DSM4 MC Constraint Board</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#04060a; --bg2:#0a0f16; --card:#101826; --card2:#182334; --line:#2e3d4e; --line2:#465b70;
    --txt:#f4f8fd; --mut:#a9bbcd; --mut2:#8ba0b4;
    --red:#ff4d5e; --redg:#ff8a95; --redbg:#2a1116;
    --org:#ff8c1a; --orgg:#ffb266; --orgbg:#2f1d0a;
    --yel:#fbbf24; --yelg:#ffd97a; --yelbg:#2a2110;
    --grn:#34d399; --grng:#7ff0c9; --grnbg:#0f2a20;
    --acc:#38bdf8; --acc2:#22d3ee; --steel:#4a5b6d;
    --shadow:0 6px 24px rgba(0,0,0,.45);
    --hdr1:rgba(10,14,19,.92); --hdr2:rgba(10,14,19,.72);
    --tagAirBg:#0f2b3d; --tagAirFg:#69c9ff; --tagUtilBg:#241a36; --tagUtilFg:#c39bff;
    --pilldone:#1c2733; --expbg:rgba(0,0,0,.15);
    --glowA:rgba(56,189,248,.10); --glowB:rgba(124,58,237,.06); --glowC:rgba(52,211,153,.04);
    --onacc:var(--onacc); --dlgshadow:0 20px 70px rgba(0,0,0,.6);
    --edge:linear-gradient(135deg,rgba(56,189,248,.8),rgba(56,189,248,.16) 32%,rgba(34,211,238,.14) 68%,rgba(124,58,237,.6));
    --edgeRed:linear-gradient(135deg,rgba(255,77,94,1),rgba(255,77,94,.25) 45%,rgba(255,138,149,.85));
    --edgeOrg:linear-gradient(135deg,rgba(255,140,26,1),rgba(255,140,26,.25) 45%,rgba(255,178,102,.85));
    --edgeYel:linear-gradient(135deg,rgba(251,191,36,.95),rgba(251,191,36,.22) 45%,rgba(255,217,122,.75));
    --edgeGrn:linear-gradient(135deg,rgba(52,211,153,.95),rgba(52,211,153,.2) 45%,rgba(127,240,201,.7));
    --edgeSteel:linear-gradient(135deg,rgba(52,211,153,.55),rgba(110,130,150,.18) 45%,rgba(127,240,201,.4));
    --glass:linear-gradient(160deg,rgba(21,30,41,.92),rgba(10,15,22,.96));
    --gloss:inset 0 1px 0 rgba(255,255,255,.14);--sheen:linear-gradient(115deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 34%,transparent 55%);
    color-scheme:dark;
  }
  /* ---------- LIGHT MODE ---------- */
  html.theme-light{
    --bg:#f2f6fa; --bg2:#ffffff; --card:#ffffff; --card2:#eaf0f6; --line:#c3d0dd; --line2:#9fb2c4;
    --txt:#0b141f; --mut:#3d5064; --mut2:#4c6076;
    --red:#d92038; --redg:#a8121f; --redbg:#ffe7ea;
    --org:#c25c00; --orgg:#8f4300; --orgbg:#fff0e0;
    --yel:#a67400; --yelg:#7a5500; --yelbg:#fff6dd;
    --grn:#067a4f; --grng:#055c3c; --grnbg:#ddf5ea;
    --acc:#07688b; --acc2:#0a87ab; --steel:#7d8fa1;
    --shadow:0 6px 22px rgba(16,26,38,.12);
    --hdr1:rgba(255,255,255,.94); --hdr2:rgba(255,255,255,.78);
    --tagAirBg:#dcf0fb; --tagAirFg:#0a6d94; --tagUtilBg:#ece3fb; --tagUtilFg:#5b32a8;
    --pilldone:#e4ebf3; --expbg:rgba(16,26,38,.035);
    --glowA:rgba(10,126,164,.07); --glowB:rgba(124,58,237,.04); --glowC:rgba(10,135,90,.04);
    --onacc:#ffffff; --dlgshadow:0 20px 60px rgba(16,26,38,.25);
    --edge:linear-gradient(135deg,rgba(7,104,139,.75),rgba(7,104,139,.18) 32%,rgba(10,135,171,.16) 68%,rgba(124,58,237,.5));
    --edgeRed:linear-gradient(135deg,rgba(217,32,56,.95),rgba(217,32,56,.25) 45%,rgba(217,32,56,.65));
    --edgeOrg:linear-gradient(135deg,rgba(194,92,0,.95),rgba(194,92,0,.25) 45%,rgba(194,92,0,.65));
    --edgeYel:linear-gradient(135deg,rgba(166,116,0,.9),rgba(166,116,0,.22) 45%,rgba(166,116,0,.6));
    --edgeGrn:linear-gradient(135deg,rgba(10,135,90,.9),rgba(10,135,90,.22) 45%,rgba(10,135,90,.6));
    --edgeSteel:linear-gradient(135deg,rgba(10,135,90,.5),rgba(120,140,160,.2) 45%,rgba(10,135,90,.35));
    --glass:linear-gradient(160deg,rgba(255,255,255,.96),rgba(244,248,252,.94));
    --gloss:inset 0 1px 0 rgba(255,255,255,.95);--sheen:linear-gradient(115deg,rgba(255,255,255,.7),rgba(255,255,255,.15) 34%,transparent 55%);
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:
    radial-gradient(1300px 650px at 85% -12%, var(--glowA), transparent 58%),
    radial-gradient(1000px 520px at 0% -5%, var(--glowB), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, var(--glowC), transparent 60%),
    var(--bg);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .wrap{max-width:1580px;margin:0 auto;padding:0 18px 70px}
  body.gated{overflow:hidden}
  #authGate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:22px;
    background:radial-gradient(1200px 700px at 50% -10%,rgba(56,189,248,.14),transparent 60%),var(--bg)}
  .authcard{width:100%;max-width:420px;border:2px solid transparent;border-radius:22px;padding:30px 28px;text-align:center;
    background:var(--glass) padding-box,var(--edge) border-box;box-shadow:var(--gloss),0 24px 70px rgba(0,0,0,.5)}
  .authlogo{width:54px;height:54px;border-radius:15px;margin:0 auto 14px;display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--onacc);
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px rgba(56,189,248,.45)}
  .authcard h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.2px}
  .authsub{color:var(--mut);font-weight:700;font-size:13px;margin:6px 0 20px}
  #authForm{display:flex;flex-direction:column;gap:10px}
  #authEmail{background:var(--bg);border:1.5px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--txt);font-size:15px;font-weight:700;text-align:center}
  #authEmail:focus{outline:none;border-color:var(--acc)}
  #authSend{padding:13px;font-size:14.5px;border-radius:12px}
  .authmsg{font-size:13px;font-weight:600;margin-top:14px;line-height:1.5;color:var(--mut)}
  .authmsg.ok{color:var(--grn)} .authmsg.err{color:var(--red)}
  .authmsg:empty{display:none}
  .authfoot{font-size:11.5px;color:var(--mut2);margin-top:18px;font-weight:600;line-height:1.5}
  .whoami{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800}
  .whoami .wemail{color:var(--mut);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .whoami .wrole{padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;font-size:9px}
  .whoami .wrole.owner{background:var(--tagUtilBg);color:var(--tagUtilFg)}
  .whoami .wrole.editor{background:var(--tagAirBg);color:var(--tagAirFg)}
  .whoami .wrole.readonly{background:var(--card2);color:var(--mut2)}
  @media(max-width:820px){.whoami .wemail{display:none}}
  /* top bar */
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px) saturate(1.3);background:linear-gradient(180deg,var(--hdr1),var(--hdr2));border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;max-width:1580px;margin:0 auto;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:.2px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:var(--onacc);font-weight:900;font-size:15px;box-shadow:0 4px 14px rgba(56,189,248,.4)}
  .brand small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.3px;margin-top:1px}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--mut);padding:6px 11px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
  .dot{width:9px;height:9px;border-radius:50%;background:#556}
  .dot.on{background:var(--grn);box-shadow:0 0 10px var(--grn)} .dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}
  .spacer{flex:1}
  .iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{border-color:var(--line2)}
  .iconbtn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:var(--onacc)}
  /* segmented control */
  .seg{display:flex;gap:5px;border:1.5px solid transparent;border-radius:15px;padding:5px;
    background:var(--glass) padding-box,var(--edge) border-box;backdrop-filter:blur(12px);box-shadow:var(--gloss)}
  .seg button{background:transparent;border:0;color:var(--mut);padding:9px 16px;border-radius:9px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.12s}
  .seg button:hover{color:var(--txt)}
  .seg button.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);box-shadow:0 4px 16px rgba(56,189,248,.45),inset 0 1px 0 rgba(255,255,255,.35)}
  /* hero KPIs */
  .hero{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0 12px}
  .kpi{position:relative;border:1.5px solid transparent;border-radius:16px;padding:12px 14px;overflow:hidden;
    background:var(--glass) padding-box,var(--edge) border-box;box-shadow:var(--gloss),0 4px 16px rgba(0,0,0,.14)}
  .kpi.red{background:var(--glass) padding-box,var(--edgeRed) border-box}
  .kpi.org{background:var(--glass) padding-box,var(--edgeOrg) border-box}
  .kpi.yel{background:var(--glass) padding-box,var(--edgeYel) border-box}
  .kpi.grn{background:var(--glass) padding-box,var(--edgeGrn) border-box}
  .kpi::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at 90% 10%,rgba(56,189,248,.12),transparent 70%);pointer-events:none}
  .kpi .kn{font-size:33px;font-weight:900;line-height:.95;letter-spacing:-1px}
  .kpi .kl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .ksub{font-size:10.5px;color:var(--mut2);margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .go{top:10px;right:12px;font-size:11px}
  .kpi .prog{margin-top:8px;height:6px}
  .kpi.red .kn{color:var(--red)} .kpi.red::after{background:radial-gradient(120px 80px at 90% 10%,rgba(255,77,94,.18),transparent 70%)}
  .kpi.yel .kn{color:var(--yel)} .kpi.yel::after{background:radial-gradient(120px 80px at 90% 10%,rgba(251,191,36,.16),transparent 70%)}
  .kpi.grn .kn{color:var(--grn)}
  .kpi.hot{border-color:var(--red)}
  .kpi.hot .kn{font-size:30px;color:var(--redg);letter-spacing:0}
  .kpi.hot .kbar{height:8px;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--redg));margin-top:12px}
  /* top-5 constraint strip */
  .tcwrap{margin:0 0 14px}
  .tclab{font-size:10px;font-weight:900;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;margin:0 0 7px;display:flex;align-items:center;gap:8px}
  .tclab i{font-style:normal;color:var(--mut2);font-weight:700;letter-spacing:0;text-transform:none;font-size:11px}
  .tcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .tcard{position:relative;border:1.5px solid transparent;border-radius:15px;padding:11px 13px;cursor:pointer;transition:.16s;overflow:hidden;
    background:var(--glass) padding-box,var(--edge) border-box;box-shadow:var(--gloss),0 3px 12px rgba(0,0,0,.12)}
  .tcard:hover{transform:translateY(-2px);box-shadow:var(--gloss),var(--shadow)}
  .tcard.act{box-shadow:var(--gloss),0 0 0 2px var(--acc)}
  .tcard.n1{background:var(--glass) padding-box,var(--edgeRed) border-box}
  .tcard .th{display:flex;align-items:baseline;gap:7px}
  .tcard .trk{font-size:11px;font-weight:900;color:var(--mut2)}
  .tcard.n1 .trk{color:var(--red)}
  .tcard .tnm{font-size:14.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .tcard .tvl{font-size:22px;font-weight:900;color:var(--red);letter-spacing:-.5px;line-height:1;margin-left:auto}
  .tcard .tsb{font-size:10px;color:var(--mut2);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcard .tbar{height:6px;border-radius:4px;background:var(--card2);margin-top:8px;overflow:hidden}
  .tcard .tfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--redg))}
  .tcempty{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px dashed var(--line2);border-radius:13px;padding:14px;color:var(--mut2);font-size:12.5px;font-weight:700;text-align:center}
  .brand{cursor:pointer;border-radius:11px;padding:2px 6px;margin-left:-6px;transition:.14s}
  .brand:hover{background:rgba(56,189,248,.09)}
  .brand:hover .logo{box-shadow:0 4px 18px rgba(56,189,248,.6)}
  /* toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 18px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;border:1.5px solid transparent;border-radius:14px;padding:5px;
    background:var(--glass) padding-box,var(--edge) border-box;backdrop-filter:blur(12px);box-shadow:var(--gloss)}
  .chips button{background:transparent;border:0;color:var(--mut);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer}
  .chips button.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
  .chips button.on[data-s="red"]{color:var(--red)} .chips button.on[data-s="yel"]{color:var(--yel)} .chips button.on[data-s="grn"]{color:var(--grn)}
  select,input[type=search]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13px;font-weight:700;outline:none}
  select:focus,input:focus{border-color:var(--acc)}
  input[type=search]{min-width:210px;flex:1;max-width:320px}
  /* board grid of cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .scard{position:relative;border:2px solid transparent;border-radius:18px;padding:0;overflow:hidden;cursor:pointer;transition:.16s;display:flex;flex-direction:column;
    background:var(--glass) padding-box,var(--edge) border-box;box-shadow:var(--gloss),0 4px 18px rgba(0,0,0,.18)}
  .scard:hover{transform:translateY(-3px);box-shadow:var(--gloss),var(--shadow)}
  .scard.red{background:var(--glass) padding-box,var(--edgeRed) border-box}
  .scard.org{background:var(--glass) padding-box,var(--edgeOrg) border-box}
  .scard.yel{background:var(--glass) padding-box,var(--edgeYel) border-box}
  .scard.grn{background:var(--glass) padding-box,var(--edgeGrn) border-box}
  .scard.done{background:var(--glass) padding-box,var(--edgeSteel) border-box}
  .scard.red:hover{box-shadow:var(--gloss),0 10px 30px rgba(255,77,94,.22)}
  .scard.org:hover{box-shadow:var(--gloss),0 10px 30px rgba(255,140,26,.2)}
  .scard::after{content:"";position:absolute;inset:0;background:var(--sheen);pointer-events:none;border-radius:inherit}
  .scard .strip{height:5px}
  .scard.red .strip{background:linear-gradient(90deg,var(--red),var(--redg))}
  .scard.yel .strip{background:linear-gradient(90deg,var(--yel),var(--yelg))}
  .scard.grn .strip{background:linear-gradient(90deg,var(--grn),var(--grng))}
  .scard.done .strip{background:var(--steel)}
  .scard .body{padding:14px 16px 15px;display:flex;flex-direction:column;gap:12px;flex:1}
  .schead{display:flex;align-items:flex-start;gap:10px}
  .light{width:15px;height:15px;border-radius:50%;flex:none;margin-top:3px}
  .light.red{background:var(--red);box-shadow:0 0 12px var(--red)} .light.yel{background:var(--yel);box-shadow:0 0 12px var(--yel)}
  .light.grn{background:var(--grn);box-shadow:0 0 8px rgba(52,211,153,.6)} .light.done{background:var(--steel)}
  .schead .h1{flex:1;min-width:0}
  .mc{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1}
  .desc{font-size:13.5px;font-weight:700;color:var(--txt);margin-top:4px;line-height:1.25}
  .code{font-size:11px;color:var(--mut);font-weight:600;margin-top:3px}
  .btagcol{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
  .pb{font-size:8.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .pb-done{background:var(--grnbg);color:var(--grn);box-shadow:inset 0 0 0 1px rgba(52,211,153,.45)}
  .pb-prog{background:var(--tagAirBg);color:var(--tagAirFg);box-shadow:inset 0 0 0 1px rgba(56,189,248,.55)}
  .pb-up{background:var(--tagUtilBg);color:var(--tagUtilFg);box-shadow:inset 0 0 0 1px rgba(124,58,237,.55)}
  .pb-later{background:var(--card2);color:var(--mut2);box-shadow:inset 0 0 0 1px var(--line)}
  .btag{font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.5px;flex:none;
    max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:var(--tagAirBg);color:var(--tagAirFg);box-shadow:inset 0 0 0 1px rgba(56,189,248,.25)}
  .gaterow{display:flex;gap:7px}
  .gp{flex:1;min-width:0;background:linear-gradient(180deg,var(--card2),var(--card));border:1.5px solid var(--line2);border-radius:11px;padding:7px 3px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .gp .gl{font-size:9.5px;color:var(--mut);font-weight:900;letter-spacing:.5px}
  .gp .gd{font-size:11.5px;font-weight:800;margin-top:2px;color:var(--txt)}
  .gp .gv{font-size:17px;font-weight:900;margin-top:1px;color:var(--txt)}
  .gp.gov.red{border-color:var(--red);background:var(--redbg)} .gp.gov.red .gv{color:var(--red)}
  .gp.gov.yel{border-color:var(--yel);background:var(--yelbg)} .gp.gov.yel .gv{color:var(--yel)}
  .gp.gov.grn{border-color:var(--grn)} .gp.gov.grn .gv{color:var(--grn)}
  .gp.sok{opacity:.5} .gp.sna{opacity:.28}
  .sfoot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
  .sfoot .big{font-size:30px;font-weight:900;letter-spacing:-1px}
  .sfoot .lbl{font-size:11px;color:var(--mut);font-weight:700;line-height:1.2}
  .sfoot .who{margin-left:auto;font-size:11px;color:var(--mut);font-weight:700;text-align:right;max-width:150px}
  .sfoot .who b{color:var(--redg)}
  .banner{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px dashed var(--line2);border-radius:14px;padding:16px 18px;margin-bottom:14px;color:var(--mut);font-size:13.5px;font-weight:600}
  .banner b{color:var(--txt)}
  /* who's holding leaderboard */
  .lead{display:flex;flex-direction:column;gap:12px}
  .lc{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .lc.top{border-color:rgba(255,77,94,.45);box-shadow:0 0 0 1px rgba(255,77,94,.15)}
  .lrow{display:flex;align-items:center;gap:16px;padding:16px 18px;cursor:pointer}
  .rank{font-size:26px;font-weight:900;color:var(--mut2);min-width:44px;text-align:center}
  .lc.top .rank{color:var(--red)}
  .lmid{flex:1;min-width:0}
  .lname{font-size:19px;font-weight:900;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .trade{font-size:10.5px;font-weight:800;color:var(--mut);background:var(--card2);padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
  .track{height:12px;border-radius:7px;background:var(--card2);margin-top:9px;overflow:hidden}

/* ---- ROW ORDER LOCK ----------------------------------------------------
   While a system panel is open, contractor rows must NEVER move. Firestore
   returns map keys in its own order on every echo, which would reshuffle the
   list mid-click and make the user chase the +/- button. So: on open we snap
   the order once (alphabetical), then hold it. New names append at the bottom.
   A row driven to 0 stays visible (at 0) instead of vanishing and shifting
   everything up. Re-sorting happens on close — behind the doors.            */
function rowKey(sysId,gate){return sysId+"|"+gate;}
function lockRowOrder(sysId){
  var s=STATE.systems[sysId];if(!s)return;
  GATE_ORDER.forEach(function(k){
    var g=s.gates[k]||{},p=g.punch||{};
    STATE.rowOrder[rowKey(sysId,k)]=Object.keys(p)
      .filter(function(n){return pv(p[n]).t>0;})
      .sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:a.toLowerCase()>b.toLowerCase()?1:0;});
  });
}
function unlockRowOrder(sysId){
  if(!sysId){STATE.rowOrder={};return;}
  GATE_ORDER.forEach(function(k){delete STATE.rowOrder[rowKey(sysId,k)];});
}
/* names to render for a gate, in locked order; appends anything new at the end */
function orderedNames(sysId,gate,punch){
  var locked=STATE.rowOrder[rowKey(sysId,gate)];
  var live=Object.keys(punch||{}).filter(function(n){return pv(punch[n]).t>0;});
  if(!locked)return live.sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:a.toLowerCase()>b.toLowerCase()?1:0;});
  var out=locked.slice();
  live.forEach(function(n){if(out.indexOf(n)<0)out.push(n);});
  return out;
}

function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtMD(iso){if(!iso)return"—";var p=iso.split("-");return (+p[1])+"/"+(+p[2]);}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}

    if(fk.name)sel+='[data-name="'+cssq(fk.name)+'"]';
    if(fk.field)sel+='[data-field="'+cssq(fk.field)+'"]';
    var fe=dlg.querySelector(sel);
    if(fe){try{fe.focus({preventScroll:true});if(caret!=null&&fe.setSelectionRange)fe.setSelectionRange(caret,caret);}catch(e){}}
  }
}
/* stepper shows OPEN. − closes one item, + re-opens one. Total is untouched. */
function stepper(sysId,gate,name,val){return '<div class="step"><button data-act="dec" data-sys="'+esc(sysId)+'" data-gate="'+gate+'" data-name="'+esc(name)+'" title="Close one item">−</button><input type="number" min="0" value="'+val+'" data-act="setinput" data-sys="'+esc(sysId)+'" data-gate="'+gate+'" data-name="'+esc(name)+'"><button data-act="inc" data-sys="'+esc(sysId)+'" data-gate="'+gate+'" data-name="'+esc(name)+'" title="Re-open one item">+</button></div>';}

function refreshContractorFilter(){var sel=$("contractorF");if(!sel)return;var cur=sel.value;var opts='<option value="ALL">All contractors</option>'+contractors().slice().sort(function(a,b){return a.name<b.name?-1:1;}).map(function(c){return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>';}).join('');if(sel.innerHTML!==opts){sel.innerHTML=opts;sel.value=cur||"ALL";}}

/* ---------- events (delegation) ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var act=t.getAttribute("data-act"),sys=t.getAttribute("data-sys"),gate=t.getAttribute("data-gate"),name=t.getAttribute("data-name");
  if(act==="openSys")openSys(sys);
  else if(act==="closeSys"){unlockRowOrder(STATE.openSysId);STATE.openSysId=null;$("sysDlg").close();}
  else if(act==="home")goHome();
  else if(act==="kpi")applyKpi(t.getAttribute("data-kpi"));
  else if(act==="toggleCw"){var nm=t.getAttribute("data-name");STATE.openCw[nm]=!STATE.openCw[nm];render();}
  else if(act==="inc")requireUnlock(function(){var s=STATE.systems[sys];setOpen(sys,gate,name,pOpen((s.gates[gate].punch||{})[name])+1);});
  else if(act==="dec")requireUnlock(function(){var s=STATE.systems[sys];setOpen(sys,gate,name,pOpen((s.gates[gate].punch||{})[name])-1);});
  else if(act==="addcGo")addContractorToGate(sys,gate);
  else if(act==="delPunch"){requireOwner(function(){
    if(!confirm("Delete "+name+"'s punch line on "+gate+"? This removes the total, closed, and open counts for this contractor on this walk."))return;
    var rk=rowKey(sys,gate);
    if(STATE.rowOrder[rk]){var ix=STATE.rowOrder[rk].indexOf(name);if(ix>=0)STATE.rowOrder[rk].splice(ix,1);}
    writePunch(sys,gate,name,0,0,false);});}
  else if(act==="delSys"){requireOwner(function(){
    var sx=STATE.systems[sys];if(!sx)return;
    if(!confirm("Delete system "+(sx.mc||sx.id)+" — "+(sx.desc||"")+"?\nThis removes the system and all its punch data for everyone."))return;
    delete STATE.systems[sys];STATE.openSysId=null;$("sysDlg").close();render();
    db.collection(SYS_COL).doc(sys).delete().then(snapshotBurn).catch(function(e){alert("Delete failed: "+e.message);});});}
});
function addContractorToGate(sys,gate){
  var inp=document.querySelector('[data-role="addcInput"][data-sys="'+cssq(sys)+'"][data-gate="'+cssq(gate)+'"]');
  var raw=inp?inp.value.trim():"";if(!raw)return;
  var totIn=document.querySelector('[data-role="addcTot"][data-sys="'+cssq(sys)+'"][data-gate="'+cssq(gate)+'"]');
  var totRaw=totIn?parseInt(totIn.value,10):0;
  requireUnlock(function(){
    var existing=contractors().filter(function(c){return c.name.toLowerCase()===raw.toLowerCase();})[0];
    var name=existing?existing.name:raw;
    if(!existing){var c=contractors().slice();c.push({name:name,trade:"Unassigned"});STATE.meta=Object.assign({},STATE.meta,{contractors:c});META_DOC.set({contractors:c},{merge:true}).catch(function(e){console.warn(e);});}
    var cur=pv((STATE.systems[sys].gates[gate].punch||{})[name]);
    var newTot=totRaw>0?(cur.t+totRaw):Math.max(1,cur.t);
    writePunch(sys,gate,name,newTot,cur.c,false);
    if(inp)inp.value="";if(totIn)totIn.value="";
  });
}

  h+='<div><label>System code (optional)</label><input id="as_code" placeholder="e.g. AD-AHU91U27"></div>';
  h+='<div><label>Target MC date</label><input type="date" id="as_target"></div>';

  h+='<div><label>W1 walk date</label><input type="date" id="as_w1"></div>';

      target:$("as_target").value||$("as_mcc").value||null,team:"",order:9000+Date.now()%100000,

function openOwner(){
  var m=STATE.meta||{};
  var h='<h3>Board settings</h3><div class="hint">🔒 Sealed: sign-in required, and only these emails can save changes. Everyone else is read-only — enforced by the database, not just the app.</div>';
  var th=TH();
  h+='<label>Color thresholds — days until a walk is due</label>';
  h+='<div class="addgrid"><div><label style="color:var(--red)">Red if under</label><input id="o_thr" type="number" min="1" value="'+th.red+'"></div>';
  h+='<div><label style="color:var(--org)">Orange if under</label><input id="o_tho" type="number" min="1" value="'+th.org+'"></div>';
  h+='<div><label style="color:var(--yel)">Yellow if under</label><input id="o_thy" type="number" min="1" value="'+th.yel+'"></div>';
  h+='<div><label style="color:var(--grn)">Green</label><input value="'+th.yel+'+ days" disabled></div></div>';
  h+='<label>"Coming up" window — highlight systems whose first walk is within</label>';
  h+='<select id="o_cw"><option value="7"'+(CW()===7?' selected':'')+'>7 days</option><option value="14"'+(CW()===14?' selected':'')+'>14 days</option><option value="30"'+(CW()===30?' selected':'')+'>30 days</option></select>';
  h+='<label>Authorized editors — these emails can save changes (owner is always allowed)</label><div id="o_alist" style="border:1px solid var(--line);border-radius:11px;padding:8px;max-height:170px;overflow:auto"></div>';
  h+='<div class="addc"><input id="o_an" type="email" placeholder="editor@company.com" style="flex:1;min-width:150px" spellcheck="false"><button class="btn" id="o_addadmin">Add editor</button></div>';
  h+='<label>Contractors &amp; trades</label><div id="o_clist" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:8px"></div>';
  h+='<div class="addc"><input id="o_newc" placeholder="New contractor name" style="flex:1"><button class="btn" id="o_addc">Add</button></div>';
  h+='<div class="dlgrow"><button class="btn" id="o_reseed">Re-sync from Excel tracker</button><button class="btn danger" id="o_resetpunch">⚠ Reset ALL punch data</button><span style="flex:1"></span><button class="btn" id="o_cancel">Close</button><button class="btn pri" id="o_save">Save</button></div>';
  $("ownerDlgBody").innerHTML=h;$("ownerDlg").showModal();
  renderCList();renderAList();
  function renderAList(){var a=editorEmails();
    var rows=OWNER_EMAILS.map(function(o){return '<div style="display:flex;gap:8px;align-items:center;padding:4px 0"><span style="flex:1;font-weight:800;font-size:13px">'+esc(o)+'</span><span class="num" style="color:var(--mut);font-weight:700">owner</span></div>';}).join('');
    rows+=a.filter(function(e){return !isOwnerEmail(e);}).map(function(e){return '<div style="display:flex;gap:8px;align-items:center;padding:4px 0"><span style="flex:1;font-weight:800;font-size:13px">'+esc(e)+'</span><span class="num" style="color:var(--acc);font-weight:700">editor</span><button class="btn" style="padding:5px 9px" data-adel="'+esc(e)+'">✕</button></div>';}).join('');
    $("o_alist").innerHTML=rows+'<div class="hint" style="margin:6px 0 0">Editors sign in with these emails (one-tap link). Everyone else is read-only.</div>';
    [].forEach.call($("o_alist").querySelectorAll("[data-adel]"),function(b){b.onclick=function(){var em=b.getAttribute("data-adel");var a2=editorEmails().filter(function(x){return x!==em;});STATE.meta=Object.assign({},STATE.meta,{editorEmails:a2});renderAList();};});}
  $("o_addadmin").onclick=function(){var n=($("o_an").value||"").trim().toLowerCase();if(!n||n.indexOf("@")<0){alert("Enter a valid email address.");return;}var a2=editorEmails();if(a2.indexOf(n)<0&&!isOwnerEmail(n))a2=a2.concat([n]);STATE.meta=Object.assign({},STATE.meta,{editorEmails:a2});$("o_an").value="";renderAList();};
  $("o_resetpunch").onclick=function(){requireOwner(function(){
    var b=boardStats();
    if(!confirm("Reset ALL punch data?\n\nThis wipes every total / closed / open count on every system ("+b.t+" total items today) and clears the burn-down history. Systems, dates, and walk sign-offs are kept.\n\nThis cannot be undone."))return;
    if(!confirm("Second check — really wipe all punch counts and start clean?"))return;
    resetAllPunch();$("ownerDlg").close();});};
  $("o_addc").onclick=function(){var v=$("o_newc").value.trim();if(!v)return;var c=contractors().slice();c.push({name:v,trade:"Unassigned"});STATE.meta=Object.assign({},STATE.meta,{contractors:c});$("o_newc").value="";renderCList();};
  $("o_cancel").onclick=function(){$("ownerDlg").close();};
  $("o_reseed").onclick=function(){if(confirm("Re-import all 70 systems from the photo transcription? Punch counts you've entered are preserved.")){reseed();$("ownerDlg").close();}};
  $("o_save").onclick=function(){
    var tr=parseInt($("o_thr").value,10)||7,to=parseInt($("o_tho").value,10)||14,ty=parseInt($("o_thy").value,10)||30;
    if(!(tr<to&&to<ty)){alert("Thresholds must increase: red < orange < yellow.");return;}
    var upd={thresholds:{red:tr,org:to,yel:ty},compWindowDays:parseInt($("o_cw").value,10)||14,contractors:contractors(),editorEmails:editorEmails(),trades:TRADES};META_DOC.set(upd,{merge:true}).then(function(){STATE.meta=Object.assign({},STATE.meta,upd);$("ownerDlg").close();render();}).catch(function(e){alert("Save failed: "+(e&&e.code==="permission-denied"?"owner only — the database rejected this.":e.message));});};
  function renderCList(){var c=contractors();$("o_clist").innerHTML=c.map(function(x,i){return '<div style="display:flex;gap:6px;align-items:center;padding:4px 0"><span style="flex:1;font-weight:800;font-size:13px">'+esc(x.name)+'</span><select data-ci="'+i+'" style="padding:6px 8px">'+TRADES.map(function(tr){return '<option '+(tr===x.trade?'selected':'')+'>'+esc(tr)+'</option>';}).join('')+'</select><button class="btn" style="padding:6px 10px" data-del="'+i+'">✕</button></div>';}).join('');
    [].forEach.call($("o_clist").querySelectorAll("select[data-ci]"),function(sel){sel.onchange=function(){var i=+sel.getAttribute("data-ci"),c2=contractors().slice();c2[i]=Object.assign({},c2[i],{trade:sel.value});STATE.meta=Object.assign({},STATE.meta,{contractors:c2});};});
    [].forEach.call($("o_clist").querySelectorAll("[data-del]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-del"),c2=contractors().slice();c2.splice(i,1);STATE.meta=Object.assign({},STATE.meta,{contractors:c2});renderCList();};});}
}
function resetAllPunch(){
  var ops=[];
  Object.keys(STATE.systems).forEach(function(id){
    var s=STATE.systems[id],dirty=false;
    GATE_ORDER.forEach(function(k){var g=s.gates&&s.gates[k];if(g&&g.punch&&Object.keys(g.punch).length){g.punch={};dirty=true;}});
    if(dirty)ops.push(function(b){b.set(db.collection(SYS_COL).doc(id),s);});
  });
  (STATE.burn||[]).forEach(function(d){if(d.date)ops.push(function(b){b.delete(db.collection(BURN_COL).doc(d.date));});});
  STATE.burn=[];STATE.rowOrder={};
  render();if(STATE.openSysId)renderModal();
  chunkedWrite(ops,function(){console.log("punch data reset");snapshotBurn();});
}
function reseed(){var ops=(window.MC_SEED||[]).map(function(s){var ex=STATE.systems[s.id],merged=JSON.parse(JSON.stringify(s));if(ex){GATE_ORDER.forEach(function(k){if(ex.gates&&ex.gates[k]&&ex.gates[k].punch&&Object.keys(ex.gates[k].punch).length)merged.gates[k].punch=ex.gates[k].punch;});}return function(b){b.set(db.collection(SYS_COL).doc(s.id),merged);};});chunkedWrite(ops,function(){snapshotBurn();});}

/* ================= AUTH GATE (sign-in required) ================= */
var CURRENT_USER=null, booted=false;
function isOwnerEmail(e){return !!e&&OWNER_EMAILS.indexOf(String(e).toLowerCase())>=0;}
function editorEmails(){var m=STATE.meta&&STATE.meta.editorEmails;return (m||[]).map(function(x){return String(x).toLowerCase();});}
function canEdit(){var e=CURRENT_USER&&(CURRENT_USER.email||"").toLowerCase();return !!e&&(isOwnerEmail(e)||editorEmails().indexOf(e)>=0);}
function isOwnerUser(){return !!CURRENT_USER&&isOwnerEmail(CURRENT_USER.email);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function showLogin(msg,kind){
  var el=$("authGate");if(!el)return;
  el.style.display="flex";document.body.classList.add("gated");
  $("authMsg").innerHTML=msg||"";$("authMsg").className="authmsg "+(kind||"");
}
function hideLogin(){var el=$("authGate");if(el)el.style.display="none";document.body.classList.remove("gated");}

function sendLink(){
  var email=($("authEmail").value||"").trim().toLowerCase();
  if(!email||email.indexOf("@")<0){showLogin("Enter a valid email address.","err");return;}
  var actionCodeSettings={url:location.href.split("#")[0].split("?")[0],handleCodeInApp:true};
  $("authSend").disabled=true;$("authSend").textContent="Sending…";
  auth.sendSignInLinkToEmail(email,actionCodeSettings).then(function(){
    lsSet("mccSignInEmail",email);
    showLogin("✓ Check your email — we sent a secure sign-in link to <b>"+esc(email)+"</b>. Open it on this device to get in. The link is single-use and expires shortly.","ok");
  }).catch(function(e){
    $("authSend").disabled=false;$("authSend").textContent="Send me a sign-in link";
    showLogin("Couldn't send the link: "+esc(e.message),"err");
  });
}
function completeLinkIfPresent(){
  if(!auth.isSignInWithEmailLink(location.href))return false;
  var email=lsGet("mccSignInEmail");
  if(!email){email=window.prompt("Confirm your email to finish signing in:");}
  if(!email)return true;
  auth.signInWithEmailLink(email,location.href).then(function(){
    lsDel("mccSignInEmail");
    try{history.replaceState(null,"",location.href.split("#")[0].split("?")[0]);}catch(e){}
  }).catch(function(e){
    showLogin("Sign-in link invalid or expired: "+esc(e.message)+" — request a new one below.","err");
  });
  return true;
}

auth.onAuthStateChanged(function(user){
  CURRENT_USER=user;
  if(user){
    hideLogin();
    $("authSend")&&($("authSend").disabled=false,$("authSend").textContent="Send me a sign-in link");
    if(!booted){booted=true;boot();}
    else{updateWhoami();render();if(STATE.openSysId)renderModal();}
  }else{
    booted=false;
    if(!completeLinkIfPresent()){
      showLogin('Sign in to view the board. Enter your work email and we’ll send you a one-tap secure link — no password.',"");
    }
  }
});
function updateWhoami(){
  var w=$("whoami");if(!w)return;
  if(!CURRENT_USER){w.textContent="";return;}
  var role=isOwnerUser()?"owner":canEdit()?"editor":"read-only";
  w.innerHTML='<span class="wemail">'+esc(CURRENT_USER.email||"")+'</span><span class="wrole '+role.replace(/[^a-z]/g,"")+'">'+role+'</span>';
}
function signOut(){auth.signOut().then(function(){STATE.systems={};STATE.unlocked=false;STATE.role=null;});}

/* kick off: wire login form immediately (script runs after the markup); auth listener drives the rest */
(function(){
  var f=$("authForm");if(f)f.addEventListener("submit",function(e){e.preventDefault();sendLink();});
  var so=$("signOutBtn");if(so)so.addEventListener("click",signOut);
  showLogin("",""); /* show gate until auth resolves, so the board never flashes before login */
})();
</script>
